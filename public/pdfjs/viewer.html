<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=no,viewport-fit=cover"><title>PDF</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2a2a2a;overscroll-behavior:none}
#toolbar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:4px;padding:4px 8px;padding-left:max(8px,env(safe-area-inset-left,8px));padding-right:max(8px,env(safe-area-inset-right,8px));padding-bottom:max(4px,env(safe-area-inset-bottom,4px));background:rgba(0,0,0,.85);color:#fff;font:12px sans-serif;height:28px;box-sizing:border-box}
#toolbar button{background:#555;border:none;color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;cursor:pointer;white-space:nowrap}
#toolbar button:hover{background:#777}
#toolbar input{background:#555;border:none;color:#fff;padding:2px 4px;border-radius:3px;font-size:11px;width:36px;text-align:center}
#toolbar select{background:#555;border:none;color:#fff;padding:2px 4px;border-radius:3px;font-size:11px;max-width:70px}
#toolbar label{font-size:10px;opacity:.7;white-space:nowrap}
#viewerContainer{position:absolute;top:0;left:0;right:0;bottom:28px;overflow:hidden;touch-action:none}
#wrapper{transform-origin:0 0;will-change:transform}
canvas{display:block;max-width:none;box-shadow:0 2px 12px rgba(0,0,0,.5)}
</style></head><body>
<div id="toolbar">
  <button id="prev">◀</button>
  <span id="pageInfo">-</span>/<span id="totalPages">-</span>
  <button id="next">▶</button>
  <input id="pageInput" type="number" min="1" value="1">
  <button id="zoomOut">−</button>
  <select id="scaleSelect">
    <option value="page-width">适合宽度</option>
    <option value="page-fit">适合长度</option>
    <option value="3" selected>300%</option>
    <option value="2">200%</option>
    <option value="1.5">150%</option>
    <option value="1">100%</option>
  </select>
  <button id="zoomIn">＋</button>
  <span style="font-size:9px;opacity:.5">清晰度</span>
  <span id="loading" style="font-size:10px;opacity:.7;margin-left:auto"></span>
<button id="fullscreenBtn" style="background:#555;border:none;color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;cursor:pointer;white-space:nowrap;margin-left:4px">⛶ 全屏</button>
</div>
<div id="viewerContainer"><div id="wrapper"></div></div>
<script src="./panzoom.min.js"></script>
<script type="module">
import { getDocument, GlobalWorkerOptions } from './pdf.min.mjs';
GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

const key=(new URL(location.href)).searchParams.get('key')||'';
const file=(new URL(location.href)).searchParams.get('file')||'';
let pdfUrl=key?sessionStorage.getItem(key)||'':decodeURIComponent(file||'');
if(!pdfUrl){wrapper.innerHTML='<div style="color:#999;text-align:center;padding:40px;font-size:14px">未指定文件</div>'}else{
if(key)sessionStorage.removeItem(key);
document.title=decodeURIComponent(pdfUrl.split('/').pop()||'PDF');

const container=document.getElementById('viewerContainer'),
      wrapper=document.getElementById('wrapper'),
      loading=document.getElementById('loading'),
      pageInput=document.getElementById('pageInput'),
      scaleSelect=document.getElementById('scaleSelect');

let pdf=null,pageNum=1,total=0,panzoom=null,wh=null,currentEntry=null,renderToken=0;
const cache=new Map();
const MAX_CACHED_PAGES=2;
const DEFAULT_RENDER_SCALE=3;
const MAX_CANVAS_PIXELS=16_000_000;
const MAX_CANVAS_DIMENSION=4096;

function getRenderScale(value=scaleSelect.value){
  const scale=parseFloat(value);
  return Number.isFinite(scale)&&scale>0?scale:DEFAULT_RENDER_SCALE;
}

function getDisplayScale(entry){
  const availableWidth=Math.max(1,container.clientWidth-16);
  const availableHeight=Math.max(1,container.clientHeight-16);
  const widthScale=availableWidth/entry.pageWidth;
  const heightScale=availableHeight/entry.pageHeight;
  if(scaleSelect.value==='page-width')return widthScale;
  if(scaleSelect.value==='page-fit')return Math.min(widthScale,heightScale);
  return Math.min(widthScale,heightScale);
}

function applyDisplaySize(entry){
  const displayScale=Math.max(0.1,getDisplayScale(entry));
  const displayWidth=entry.pageWidth*displayScale;
  const displayHeight=entry.pageHeight*displayScale;
  entry.displayWidth=displayWidth;
  entry.displayHeight=displayHeight;
  entry.canvas.style.width=`${displayWidth}px`;
  entry.canvas.style.height=`${displayHeight}px`;
  wrapper.style.width=`${displayWidth}px`;
  wrapper.style.height=`${displayHeight}px`;
}

function getFitPosition(entry){
  return {
    scale:1,
    x:Math.max(0,(container.clientWidth-entry.displayWidth)/2),
    y:Math.max(0,(container.clientHeight-entry.displayHeight)/2)
  };
}

// Panzoom 只负责用户手势缩放；初始适配通过 CSS 显示尺寸完成，避免移动端缩放超大画布时丢失画面。
function initPan(entry){
  if(panzoom){panzoom.destroy();panzoom=null}
  applyDisplaySize(entry);
  const fit=getFitPosition(entry);
  panzoom=Panzoom(wrapper,{
    maxScale:5,minScale:0.3,contain:'outside',
    startScale:fit.scale,startX:fit.x,startY:fit.y,
    pinchGesture:true,step:0.15
  });
  wh=e=>{if(e.ctrlKey||e.metaKey)panzoom.zoomWithWheel(e);else e.preventDefault()};
  container.addEventListener('wheel',wh,{passive:false});
}

function killPan(){
  if(panzoom){panzoom.destroy();panzoom=null;container.removeEventListener('wheel',wh)}
  wrapper.style.transform='';
}

function showError(error,request=renderToken){
  if(request!==renderToken)return;
  loading.textContent='失败';
  wrapper.innerHTML=`<div style="color:#f66;text-align:center;padding:40px">加载失败: ${error?.message||error}</div>`;
}

async function renderCanvas(page,requestedScale){
  const baseViewport=page.getViewport({scale:1});
  const maxScale=Math.min(
    requestedScale,
    MAX_CANVAS_DIMENSION/Math.max(baseViewport.width,baseViewport.height),
    Math.sqrt(MAX_CANVAS_PIXELS/(baseViewport.width*baseViewport.height))
  );
  const attempts=[...new Set([maxScale,maxScale*.75,maxScale*.5,Math.min(maxScale,1)].filter(s=>Number.isFinite(s)&&s>0))];
  let lastError=null;
  for(const safeScale of attempts){
    let canvas=null;
    try{
      const viewport=page.getViewport({scale:safeScale});
      canvas=document.createElement('canvas');
      canvas.width=Math.ceil(viewport.width);
      canvas.height=Math.ceil(viewport.height);
      const context=canvas.getContext('2d');
      if(!context)throw new Error('无法创建 PDF 画布');
      await page.render({canvasContext:context,viewport}).promise;
      return {
        canvas,
        pageWidth:baseViewport.width,
        pageHeight:baseViewport.height,
        renderWidth:viewport.width,
        renderHeight:viewport.height,
        renderScale:safeScale
      };
    }catch(error){
      lastError=error;
      if(canvas){canvas.width=1;canvas.height=1}
    }
  }
  throw lastError||new Error('PDF 页面渲染失败');
}

async function loadPdf(){
  loading.textContent='⏳';
  const task=getDocument({url:pdfUrl,disableRange:true,disableStream:false});
  task.onProgress=p=>{if(p.total)loading.textContent=Math.round(100*p.loaded/p.total)+'%'};
  pdf=await task.promise;
  total=pdf.numPages;
  document.getElementById('totalPages').textContent=total;
  pageInput.max=total;
  await renderPage(1);
}

async function renderPage(num){
  const request=++renderToken;
  loading.textContent='⏳';
  if(cache.has(num)){
    if(request!==renderToken)return;
    showCached(num);updateUI(num);loading.textContent='';return;
  }
  killPan();
  currentEntry=null;
  wrapper.innerHTML='';
  const page=await pdf.getPage(num);
  const entry=await renderCanvas(page,getRenderScale());
  if(request!==renderToken||num!==pageNum)return;
  cache.set(num,entry);
  if(cache.size>MAX_CACHED_PAGES)cache.delete(cache.keys().next().value);
  currentEntry=entry;
  wrapper.appendChild(entry.canvas);
  initPan(entry);
  updateUI(num);
  loading.textContent='';
}

function showCached(num){
  killPan();
  currentEntry=cache.get(num);
  wrapper.innerHTML='';
  wrapper.appendChild(currentEntry.canvas);
  initPan(currentEntry);
}

function updateUI(num){pageNum=num;document.getElementById('pageInfo').textContent=num;pageInput.value=num}

function renderPageSafely(num){renderPage(num).catch(error=>showError(error))}
function goPage(n){if(n<1||n>total)return;pageNum=n;cache.clear();renderPageSafely(n)}
function applyScale(s){scaleSelect.value=s;cache.clear();renderPageSafely(pageNum)}

if(window.ResizeObserver){
  const observer=new ResizeObserver(()=>{
    if(!currentEntry)return;
    applyDisplaySize(currentEntry);
    if(panzoom)initPan(currentEntry);
  });
  observer.observe(container);
}

document.getElementById('prev').onclick=()=>goPage(pageNum-1);
document.getElementById('next').onclick=()=>goPage(pageNum+1);
pageInput.onchange=()=>goPage(parseInt(pageInput.value,10)||1);
document.getElementById('zoomIn').onclick=()=>{const s=parseFloat(scaleSelect.value)||1;applyScale(Math.min(4,s*1.3))};
document.getElementById('zoomOut').onclick=()=>{const s=parseFloat(scaleSelect.value)||1;applyScale(Math.max(0.25,s/1.3))};
scaleSelect.onchange=()=>{const v=scaleSelect.value;if(v==='page-width'||v==='page-fit'){applyScale(v)}else{applyScale(v)}};
// iOS Safari 的 Fullscreen API 仅对 video 元素有效，对普通元素调用静默无反应
// 因此 iOS 全系直接用 postMessage 通知父页面做 CSS 全屏
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

document.getElementById('fullscreenBtn').onclick=()=>{
  if (isIOS) {
    window.parent.postMessage({ type: 'toggle-pdf-fullscreen' }, '*');
    return;
  }
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')goPage(pageNum+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')goPage(pageNum-1);
  else if(e.key==='+'||e.key==='='){const s=parseFloat(scaleSelect.value)||1;applyScale(Math.min(4,s*1.3))}
  else if(e.key==='-'){const s=parseFloat(scaleSelect.value)||1;applyScale(Math.max(0.25,s/1.3))}
  else if(e.key==='f'&&!e.ctrlKey&&!e.metaKey){
    if(isIOS){window.parent.postMessage({type:'toggle-pdf-fullscreen'},'*');return}
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}
    else{document.exitFullscreen().catch(()=>{})}
  }
});


loadPdf().catch(e=>{wrapper.innerHTML=`<div style="color:#f66;text-align:center;padding:40px">加载失败: ${e.message}</div>`});
}
</script></body></html>
